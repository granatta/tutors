<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavori in Corso — I tuoi Super Tutor</title>
<style>
  @import url('https://googleapis.com');

  :root {
    --bg: #0b0f19;
    --surface: #161f30;
    --border: #2e3f5b;
    --ink: #f8fafc;
    --ink-soft: #94a3b8;
    --neon-orange: #ff7a00;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  /* Sfondo con effetto sfumatura radiale soft */
  body::before {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255, 122, 0, 0.08) 0%, rgba(0,0,0,0) 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
  }

  .container {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 24px;
    padding: 48px 32px;
    text-align: center;
    max-width: 480px;
    width: 100%;
    z-index: 1;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 122, 0, 0.1);
    border: 1px solid rgba(255, 122, 0, 0.3);
    color: var(--neon-orange);
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 24px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge-dot {
    width: 8px;
    height: 8px;
    background: var(--neon-orange);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 16px;
    line-height: 1.2;
  }

  p {
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .btn-back {
    display: inline-block;
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--ink);
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
  }

  .btn-back:hover {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
    transform: translateY(-2px);
  }

  @keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.6; }
    50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 8px var(--neon-orange); }
    100% { transform: scale(0.9); opacity: 0.6; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="badge">
    <span class="badge-dot"></span>
    In arrivo
  </div>

  <h1>Il Tutor è a lezione 🏛️</h1>

  <p>Stiamo preparando i materiali, l'almanacco giornaliero e le intelligenze artificiali per questa materia. Torna a trovarci tra pochi giorni!</p>

  <!-- Puoi cambiare il link "#" con "/" per tornare alla home principale -->
  <a href="/" class="btn-back">Torna alle materie</a>
</div>

</body>
</html>
